enabled: false
task:
  position_weight: [1.0, 1.0, 1.0]
  position_tolerance_m: 0.03
  # Active joint order:
  # waist_yaw, waist_roll, waist_pitch,
  # left shoulder pitch/roll/yaw, left elbow, left wrist roll/pitch/yaw,
  # right shoulder pitch/roll/yaw, right elbow, right wrist roll/pitch/yaw.
  #
  # Real G1 profile:
  # - waist remains effectively locked by the cartesian-servo code path
  # - active arm can move farther than the sim baseline
  # - inactive arm is still hard-held by QP bounds in cartesian servo mode
  joint_tracking_weight: [0.0, 0.0, 0.0,
                          0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8,
                          0.8, 0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
  joint_tolerance_rad: [0.10, 0.08, 0.08,
                        0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15,
                        0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15]
  inactive_arm_hold_weight: 4.0
  inactive_arm_hold_tolerance_rad: 0.06
  # Real teleop/GMR: do not let the fast QP layer modify waist. Waist should be
  # handled only by SONIC or the slower outer posture loop.
  lock_waist_correction: true
  cartesian_servo_schedule:
    enabled: true
    far_distance_m: 0.10
    mid_distance_m: 0.05
    near_distance_m: 0.02
    position_weight_scale:
      far: 6.0
      mid: 12.0
      near: 24.0
      close: 36.0
    active_arm_joint_weight_scale:
      far: 0.65
      mid: 0.45
      near: 0.30
      close: 0.20
    active_arm_max_velocity_rad_s:
      far: 1.00
      mid: 0.90
      near: 0.70
      close: 0.50
previous_delta_weight: 0.03
reference_timeout_ms: 150
reference:
  source: gmr
  host: 127.0.0.1
  port: 5558
  topic: gmr_ref
startup_ramp_sec: 1.5
max_solve_time_ms: 2.0
# Real G1: relax arm total correction to avoid infeasible-bound fallback when
# SONIC's upper target is far from the cartesian/IK reference. Waist stays tiny.
max_delta_rad: [0.005, 0.003, 0.003,
                2.5, 2.5, 2.5, 2.5, 2.5, 2.5, 2.5,
                2.5, 2.5, 2.5, 2.5, 2.5, 2.5, 2.5]
max_velocity_rad_s: [0.020, 0.012, 0.012,
                     0.80, 0.80, 0.80, 0.80, 0.80, 0.80, 0.80,
                     0.80, 0.80, 0.80, 0.80, 0.80, 0.80, 0.80]
nonlinear_validation:
  enabled: true
  cartesian_relinearization_iterations: 2
  # Allow a small model/noise margin on real hardware. This prevents rejecting
  # useful candidates only because nonlinear FK validation is a few millimeters
  # worse than the pre-correction state.
  min_improvement_m: -0.005
  backtracking_initial_alpha: 1.0
  backtracking_factor: 0.5
  backtracking_min_alpha: 0.03125
invalid_fallback:
  mode: decay
  decay_time_sec: 0.30
joint_lower_rad: [-3.14, -1.20, -1.20,
                  -2.87, -1.34, -1.57, -1.05, -1.57, -0.52, -0.52,
                  -2.87, -3.11, -1.57, -1.05, -1.57, -0.52, -0.52]
joint_upper_rad: [ 3.14,  1.20,  1.20,
                   2.87,  3.11,  1.57,  1.40,  1.57,  0.52,  0.52,
                   2.87,  1.34,  1.57,  1.40,  1.57,  0.52,  0.52]
