# Hardware config copied from url_g1_deploy commit
# 3d37aa43f88964fc4255857c840dd33dd08e6eda. Joint mapping, gains, default
# pose, arm target source and arm smoothing remain the target deployment values.
# The only simulation-specific source change below is cmd_source: dds; MuJoCo
# publishes keyboard velocity on rt/nav_cmd. Policy output is 12 leg joints,
# while num_actions: 29 describes the complete robot command slots.
#
# DreamWaQ controls its exported 12 lower-body joints. The selected export keeps
# the waist fixed by its manifest. PATH owns the 14 arm targets through rt/arm_sdk.

control_dt: 0.02          # 50 Hz, matches simulation_dt(0.005) * control_decimation(4)

num_actions: 29           # full hardware DoF

msg_type: "hg"
imu_type: "pelvis"        # Target deployment uses the pelvis/base IMU only

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# Body order == hardware order == Unitree G1JointIndex (identity mapping).
joint2motor_idx: [0, 1, 2, 3, 4, 5,        # left leg
                  6, 7, 8, 9, 10, 11,      # right leg
                  12, 13, 14,              # waist yaw/roll/pitch
                  15, 16, 17, 18, 19, 20, 21,   # left arm
                  22, 23, 24, 25, 26, 27, 28]   # right arm

# Gains are retained from the selected target deployment config.
kps: [40.179237, 99.09843, 40.179237, 99.09843, 28.501245, 28.501245, # left leg
      40.179237, 99.09843, 40.179237, 99.09843, 28.501245, 28.501245, # right leg
      300, 300, 300,                                                   # waist
      40, 40, 40, 40, 20, 20, 20,          # left arm
      40, 40, 40, 40, 20, 20, 20]          # right arm
kds: [2.55789, 6.30880, 2.55789, 6.30880, 1.81445, 1.81445,
      2.55789, 6.30880, 2.55789, 6.30880, 1.81445, 1.81445,
      3, 3, 3,
      5, 5, 5, 5, 1, 1, 1,
      5, 5, 5, 5, 1, 1, 1]

# Full 29-dim default pose copied from the target deployment config.
default_angles: [-0.2, 0.0, 0.0, 0.42, -0.23, 0.0,  # left leg
                 -0.2, 0.0, 0.0, 0.42, -0.23, 0.0,  # right leg
                  0.0, 0.0, 0.0,                      # waist
                  0.0, 0.4, 0.0, 1.2, 0.0, 0.0, 0.0,  # left arm
                  0.0, -0.4, 0.0, 1.2, 0.0, 0.0, 0.0] # right arm

# cmd_vel limits [vx, vy, wz] (m/s, m/s, rad/s).
max_cmd: [0.6, 0.4, 0.5]       # clipped to the DreamWaQ training envelope
cmd_deadzone: 0.1         # stick deadzone (fraction of full scale)

# MuJoCo publishes keyboard cmd_vel on rt/nav_cmd.
cmd_source: "dds"
cmd_udp_bind_host: "192.168.123.164"
cmd_udp_port: 15001
cmd_udp_allowed_host: "192.168.123.2"
cmd_udp_timeout: 0.3
# Optional hardware UDP source; unused in the local MuJoCo config.
cmd_dds_timeout: 0.3

# Arm-target source for joints 15..28:
#   "hold"    -> hold the default arm pose (safest for bring-up)
#   "arm_sdk" -> read xr_teleoperate's rt/arm_sdk publications (recommended for teleop)
#   "redis"   -> read a 14-float JSON channel from Redis
arm_source: "arm_sdk"
arm_redis_key: "action_arm_unitree_g1_homie"
arm_redis_timeout: 0.2   # seconds; hold default if channel is stale

# Low-pass time constant (seconds) smoothing arm_sdk mode's raw target before it's sent.
# xr_teleoperate's own rt/arm_sdk publish rate is irregular in practice (Thor-side IK/
# vision/recording load); the G1 firmware's native rt/arm_sdk overlay apparently smooths
# over that on its own, but that overlay is bypassed once DreamWaQ owns rt/lowcmd, so we do
# it ourselves here. Larger = smoother but more lag; smaller = snappier but more
# "stepping" whenever teleop's own updates arrive unevenly. 0 disables smoothing.
arm_smoothing_tau: 0.04

# Feedforward torque (tau) safety copied from the target deployment config and
# forwarded from PATH's motor_cmd[15:29].tau
# (gravity comp) alongside q/kp/kd. Conservative on purpose -- this is added on TOP of
# the PD position tracking, not relied on for it. Forced to exactly 0 regardless of
# these settings whenever teleop is disengaged, the rt/arm_sdk sample is stale, or any
# element is NaN/Inf (see arm_target_source.py).
arm_tau_scale: 1.0     # multiplier applied to teleop's raw tau after the weight scale
# N*m, hard per-joint clamp applied after scaling. Per-joint (G1 URDF effort limits),
# order = ARM_MOTOR_IDS = G1_29_JointArmIndex (see arm_target_source.py):
#   [L shoulder pitch/roll/yaw, L elbow, L wrist roll/pitch/yaw,
#    R shoulder pitch/roll/yaw, R elbow, R wrist roll/pitch/yaw]
# A scalar is also accepted (broadcasts to all 14 joints).
arm_tau_clamp: [25, 25, 25, 25, 25, 5, 5, 25, 25, 25, 25, 25, 5, 5]
