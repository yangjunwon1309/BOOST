# Cartesian wrist reference behavior for the 50 Hz PATH arm bridge.
damped_se3:
  zeta: 1.5
  omega_n_rad_s: 5.0
  linear_speed_limit_m_s: 0.06
  angular_speed_limit_rad_s: 0.6
  minimum_duration_s: 1.0
  direct_position_error_m: 0.10

xr_continuity:
  max_linear_speed_m_s: 2.0
  max_angular_speed_rad_s: 10.0
  resync_after_s: 0.3
  lowpass_cutoff_hz: 5.0
  reacquire_gap_s: 0.15
  tracking_hold_s: 1.0
