services:
  sam3-pascal:
    build:
      context: .
      dockerfile: Dockerfile
    image: sam3-pascal
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      TORCHINDUCTOR_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
    shm_size: 8gb
    volumes:
      - ./workspace:/workspace
      - ./scripts:/workspace/scripts:ro
      - ./results:/workspace/results
      - ./logs:/workspace/logs
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    working_dir: /workspace
    command: bash
    stdin_open: true
    tty: true
