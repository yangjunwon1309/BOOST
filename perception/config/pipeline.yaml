lcm_url: "udpm://239.255.76.67:7667?ttl=1"
web_port: 8080
depth:
  min_depth_m: 0.15
  max_depth_m: 3.0
  sync_tol_ms: 20
segmentation:
  # `tensorrt` requires the board-local engine below. Use `--backend pytorch`
  # for an explicit diagnostic fallback.
  backend: tensorrt
  # SAM3 is prompt-driven; these concepts form the default robot-scene
  # vocabulary. The web page can replace them at runtime with a comma-separated
  # list. "object" is a broad fallback, not a guaranteed panoptic mode.
  # The full TensorRT graph runs once per concept. Keep the default to one
  # broad prompt for minimum latency; add specific prompts from the web UI.
  concepts: [object]
  target_hz: 8.0
  min_score: 0.5
  min_area_px: 400
  miss_ttl: 10
  # Keep credentials outside this file. The default builder reads the gated
  # checkpoint through the mounted Hugging Face cache.
  checkpoint: null
  tensorrt:
    engine: /models/sam3_trt/sam3_fp16_4out.engine
    model_id: facebook/sam3
    mask_threshold: 0.5
  # Remote RTX worker settings. Shared thresholds above remain the defaults;
  # this map holds only SAM3-specific remote geometry persistence overrides.
  sam3:
    concepts: [object]
    track:
      geometry_fallback_ttl_frames: 6
      geometry_fallback_score_decay: 0.97
  # Shared RGB-D self-filter for every vision backend. The server/remote worker
  # reads synchronized LCM depth, color intrinsics, camera extrinsics and
  # G1_ROBOT_STATE, renders padded FK collision primitives to a robot depth
  # buffer, then vetoes mask pixels at or behind that depth.
  depth_self_filter:
    enabled: true
    margin_high_m: 0.055
    margin_low_m: 0.030
    temporal_alpha: 0.35
    temporal_reset_threshold_m: 0.080
    bilateral_diameter: 5
    bilateral_sigma_depth_m: 0.040
    bilateral_sigma_space_px: 4.0
    padding_scale: 1.05
    arm_radius_m: 0.055
    wrist_radius_m: 0.075
    torso_radius_m: 0.090
    sample_step_m: 0.020
  # Official SAM2.1 Tiny generic-mask replacement.  Select explicitly with
  # --backend sam2-tiny after building the updated perception image.
  sam2:
    checkpoint: /models/sam2/sam2.1_hiera_tiny.pt
    reinitialization: central
    reinitialize_interval_frames: 15
    automatic_points_per_side: 8
    max_masks: 12
    central:
      reference_width_px: 640
      reference_height_px: 360
      roi_center_px: [320, 200]
      roi_radius_px: [220, 125]
      prompt_spacing_px: 50
      # Keep the last valid mask through short predictor/discovery dropouts.
      track_missing_ttl_frames: 24
      track_fallback_score_decay: 0.985
      reinitialize_match_iou: 0.15
  # EfficientTAM Tiny-512 uses SAM2-style prompted masks/video architecture
  # with a 512px encoder. Select explicitly with --backend efficienttam-ti-512.
  efficienttam:
    checkpoint: /models/efficienttam/efficienttam_ti_512x512.pt
    reinitialization: central
    reinitialize_interval_frames: 15
    automatic_points_per_side: 8
    max_masks: 12
    central:
      reference_width_px: 640
      reference_height_px: 360
      roi_center_px: [320, 200]
      roi_radius_px: [220, 125]
      prompt_spacing_px: 50
      # Preserve an object for ~7 s at the default 3.5 Hz if an automatic
      # reinitialization or one box-prompt frame temporarily misses it.
      track_missing_ttl_frames: 24
      track_fallback_score_decay: 0.985
      reinitialize_match_iou: 0.15
  # COCO-80 semantic instance segmentation.  It is intentionally opt-in:
  # --backend yolo11-seg.
  yolo11:
    checkpoint: /models/yolo11/yolo11n-seg.pt
    imgsz: 640
    # Only COCO instances with score >= 0.80 may become masks/tracks/belief
    # candidates. Lower-score detections never enter persistence fallback.
    confidence: 0.80
    iou_threshold: 0.50
    max_masks: 20
    quantize: 16
    # Empty means all COCO classes except excluded_classes.  Restrict this
    # list later if the real workcell needs only a smaller class set.
    allowed_classes: []
    excluded_classes: [person]
    track:
      # Retained internally only for a later IoU re-association. Missing
      # detector frames republish the last verified 3-D cylinder/contact for a
      # short bounded interval; no new geometry is inferred during the hold.
      missing_ttl_frames: 6
      fallback_score_decay: 0.985
      match_iou: 0.15
      geometry_fallback_ttl_frames: 6
      geometry_fallback_score_decay: 0.97
cloud:
  workspace_lims: [-1.0, 1.0, -1.0, 1.0, 0.1, 1.5]
  voxel_size_m: 0.005
  object_max_points: 8000
  # Common geometry input for object center, cylinder fitting and contact
  # generation. These gates run after the robot self-mask has been removed.
  object_filter:
    enabled: true
    erosion_px: 2
    depth_edge_threshold_m: 0.030
    mad_scale: 6.0
    min_depth_band_m: 0.150
    voxel_size_m: 0.005
    radius_outlier_m: 0.018
    min_radius_neighbors: 3
grip:
  h_th_m: 0.12
  finger_clearance_m: 0.005
  grasp_depth_max_m: 0.04
  gripper_max_width_m: 0.08
  gripper_axis_convention: "x_closing_z_approach"
  top_k: 4
  side_approach_angles_deg: [0, 30, -30]
reid:
  model: "dinov2_vits14"
  local_repo: null
  checkpoint: null
  match_th: 0.72
  hysteresis: 0.08
  confirm_n: 3
  gallery_k: 16
  diversity_th: 0.90
  use_size_gate: true
publish:
  keepalive_hz: 1.0
  stale_after_s: 1.5
ee_target:
  # With --enable-ee-publishing, the server continuously emits both hand
  # belief targets. A/B selection is performed only by the PATH bridge.
  belief_publishing_enabled: true
  # Test mode: accept any finite segmented center without range or timing gates.
  bypass_checks: true
  camera_info: config/camera_info.yaml
  extrinsics: config/extrinsics.yaml
  # identity uses a fixed camera->goal transform and ignores pelvis->torso IMU/FK
  # rotation. This is the most stable mode while the RGB-D extrinsics are still
  # only approximate. Alternatives: joint_fk, dual_imu.
  torso_estimator: identity
  # Wi-Fi RGB frames can arrive 70–100 ms after the latest Thor state packet.
  # Keep geometry enabled for a state sample up to 200 ms old; the worker still
  # requires finite state, calibration, depth, and a configured camera transform.
  robot_state_max_delta_ms: 200.0
  max_imu_fk_disagreement_deg: 12.0
  max_waist_speed_rad_s: 0.15
  side: left
  target_link: left_wrist_yaw_link
  quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
  # Added after transforming the segmented center into pelvis_identity_fk.
  position_offset_goal_m: [0.0, 0.0, 0.0]
  duration_sec: 2.0
  final_hold_sec: 1.0
  auto_publish_hz: 5.0
  tracking_lost_grace_frames: 3
  tracking_max_jump_m: 0.25
  max_frame_age_sec: 1.5
  min_depth_points: 80
  goal_endpoint: tcp://127.0.0.1:5564
  goal_topic: path_static_ee_target
  # Direct PATH control consumes only path_static_ee_target.  Do not also
  # publish legacy cuRobo path_goal commands on port 5561.
  send_planner_goal: false
  planner_endpoint: tcp://127.0.0.1:5561
  planner_topic: path_goal
  workspace:
    x: [-0.15, 0.45]
    left_y: [0.03, 0.50]
    right_y: [-0.50, -0.03]
    z: [-0.30, 0.35]
    radius_m: 0.62
tasc_belief:
  enabled: true
  # Replace the old SAM3 mask center target with the selected depth contact
  # point from the hierarchical grip belief. The existing QP-IK publisher and
  # coordinate frame stay unchanged.
  use_contact_target: true
  object_max_points: 8000
  object_track_max_distance_m: 0.25
  object_track_missing_ttl_frames: 5
  log_every_sec: 1.0
  action_apply_time: 0.01
  feature_ema_alpha: 0.25
  robust_standardize:
    min_signal_spread: 0.002
    scale_floor: 0.01
    clip: 2.0
  beta: 1.0
  w_sc: 0.95
  max_prob_any_goal: 0.99
  jump:
    enabled: true
    lambda0: 0.05
    kappa: 2.0
    switch_sigma_d: 0.15
    # Uniform posterior-drift probability per nominal 30 Hz belief tick.
    # Runtime scales it exponentially by elapsed time.
    persist_leak: 0.02
  # Object/contact and orientation belief are separate posteriors. Dex1 uses
  # base-local +Y as finger extension/approach and +/-X as jaw spread.
  hand_model: dex1
  orientation:
    enabled: true
    beta: 1.0
    w_sc: 0.95
    max_prob: 0.99
    ema_alpha: 0.25
    relations: [parallel, perpendicular]
    hand_axis_local: [0.0, 1.0, 0.0]
    match_max_distance_m: 0.08
    match_max_normal_deg: 25.0
    track_missing_ttl_frames: 5
    switch_dwell_frames: 15
    advantage_scale: 0.5
    gravity_snap_deg: 15.0
    ghost_decay: 0.35
    role_hard_filter: false
    label_prior_scale: 1.0
    switch_gamma_h: 3.0
    switch_gamma_omega: 1.0
    switch_omega_ref: 0.5
    # Persistent world-frame surface-axis bank. Gravity candidates are always
    # recomputed from the live IMU and are never position/contact candidates.
    bank:
      axis_ema_alpha: 0.30
      coast_ttl_frames: 24
      max_coast_seconds: 4.0
      coast_decay: 0.90
      assoc_max_axis_deg: 30.0
      assoc_base_distance_m: 0.10
      assoc_drift_mps: 0.15
      gravity_candidate_enabled: true
      gravity_label_prior: -0.3
      contact_requires_active: true
      goal_fallback_ttl_frames: 3
    pseudo:
      enabled: true
      max_points: 1
      plane_ransac_iters: 60
      plane_inlier_thresh_m: 0.006
      min_inlier_ratio: 0.35
      plane_residual_mad_scale: 2.5
      plane_refit_iters: 2
      gravity_snap_deg: 15.0
      hole_min_radius_m: 0.002
      hole_max_radius_m: 0.100
      cylinder_max_stale_frames: 5
      cylinder_ref_coverage: 0.5
  per_hand_parallel: true
  beta_armed: 1.0
  beta_idle: 0.2
  lambda0_armed: 0.05
  lambda0_idle: 0.30
  beta_ramp_tau_s: 0.2
  commit_boost_enabled: false
  dual_hand_exclusive: false
  pos_switch_sigma_d: 0.15
  pos_switch_gamma_u: 2.0
  geometry_update_hz: 8.0
  belief_update_hz: 30.0
  belief_telemetry_hz: 15.0
  max_objects: 10
  max_contacts_per_object: 6
  max_orientation_candidates: 96
  # Dex1 canonical grasp center in the hand base frame. Validate the hardware
  # offset against the installed Dex1 URDF before any real grasp experiment.
  grasp_center_local_m: [0.0, 0.100, 0.0]
  fallback_eef_position_m: [0.0, 0.0, 0.0]
  features:
    w_distance: 1.4
    w_progress: 1.0
    w_agreement: 0.4
    w_reach: 1.0
    w_delta: 0.0
    w_align: 0.9
    align_min_quality: 0.25
    w_orientation: 0.8
    min_user_speed_mps: 0.005
    distance: {k: 1.5, delta: 0.10, c: 0.1}
    agreement: {lambda_a: 1.0, kappa: 0.25}
    delta: {lambda_d: 0.3, lpf_alpha: 0.5}
    orientation:
      align_k: 1.0
      align_delta: 0.30
      hold_lambda: 1.0
      converge_lambda: 0.5
      omega_ref_rps: 0.5
      # Filtered PICO command omega: ignore physiological hand tremor while
      # retaining deliberate orientation motion.
      min_hand_omega_rps: 0.08
  grip:
    enable: true
    top_k: 4
    surface_augment: 8
    h_th_m: 0.12
    grip_update_hz: 10
    w_geom_prior: 1.0
    match_max_distance_m: 0.04
    merge_distance_m: 0.03
    switch_dwell_frames: 2
    switch_margin: 0.0
    table_normal: [0.0, 0.0, 1.0]
    # Persistent object-centric cylinder fitted with robust SciPy least squares.
    # Failed/occluded updates retain the last valid surface for stale_ttl_frames;
    # only an object with no valid cylinder falls back to the legacy PCA/FPS set.
    surface_model:
      enabled: true
      labels: [bottle, can, cup]
      min_points: 120
      min_radius_m: 0.015
      max_radius_m: 0.12
      min_height_m: 0.04
      max_height_m: 0.50
      inlier_threshold_m: 0.015
      min_inlier_ratio: 0.45
      min_angular_coverage: 0.20
      max_fit_rmse_m: 0.015
      max_center_shift_m: 0.15
      update_alpha: 0.35
      stale_ttl_frames: 15
      sample_spacing_m: 0.025
      max_candidates: 24
      max_nfev: 80
      prior_weight: 2.0
registry_dir: "registry_data"
