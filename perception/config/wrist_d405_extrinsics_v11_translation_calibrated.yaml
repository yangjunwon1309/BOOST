# Rotation is constructed, not fitted:
# R_wrist_camera = Ry(+20 deg) @ P
# P maps RealSense optical axes to G1 wrist_yaw_link:
# optical +z -> wrist +x, optical +x -> wrist -y, optical +y -> wrist -z.
# The 20-degree tilt is about wrist +y because wrist +x is forward.
# At q=0, optical +z in pelvis is [0.9397, 0, -0.3420].
# Translation is nominal and must be re-fitted only after hardware validation.
