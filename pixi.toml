[workspace]
name = "boost"
version = "0.1.0"
description = "BOOST host-side teleoperation and service launch tools"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  { name = "desktop-hand", platform = "linux-64", cuda = "12", glibc = "2.35" },
  { name = "thor", platform = "linux-aarch64", cuda = "13", glibc = "2.39" },
  { name = "thor-teleop", platform = "linux-aarch64", glibc = "2.39" },
]

# This is intentionally a CPU/host tooling environment. CUDA, PyTorch, SAM3,
# TensorRT, and their Python bindings stay inside the NVIDIA Docker image.
[dependencies]
python = "==3.12.3"

# Pinned host-side runtime and maintenance tools. GPU inference remains inside
# the SAM3 containers defined under services/pose_service/docker/.
[pypi-dependencies]
annotated-doc = "==0.0.5"
annotated-types = "==0.8.0"
anyio = "==4.14.2"
click = "==8.4.2"
fastapi = "==0.141.1"
h11 = "==0.16.0"
idna = "==3.18"
iniconfig = "==2.3.0"
lcm = "==1.5.2"
msgpack = "==1.2.1"
numpy = "==1.26.4"
opencv-python-headless = "==4.11.0.86"
packaging = "==26.3"
pillow = "==10.2.0"
pluggy = "==1.6.0"
pydantic = "==2.13.4"
pydantic-core = "==2.46.4"
pygments = "==2.20.0"
pytest = "==9.1.1"
pyyaml = "==6.0.1"
pyzmq = "==27.1.0"
ruff = "==0.16.3"
scipy = "==1.17.1"
starlette = "==1.6.0"
typing-extensions = "==4.16.0"
typing-inspection = "==0.4.4"
uvicorn = "==0.52.3"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/services/pose_service"

[tasks]
verify-host = "python services/pose_service/tools/verify_pixi_host_environment.py"
test-perception = "python -m pytest -q services/pose_service/tests"
sam3-worker = { cmd = "bash tools/run_remote_sam3_wrist_d405_v11.sh", cwd = "services/pose_service" }

# The desktop MuJoCo stack is isolated from the host/perception environment.
# `mujoco` runs the G1 simulator, the in-process DreamWaQ policy, PATH's arm
# bridge, and the Revo2 DDS adapter on loopback. Televuer and Unitree SDK2
# Python are pinned Pixi dependencies.
[feature.sim.dependencies]
python = "3.10.*"
cyclonedds = "==0.10.5"
pytorch = ">=2.1,<3"
glfw = "*"
libglvnd = "*"
xorg-libx11 = "*"
xorg-libxext = "*"
xorg-libxrender = "*"
xorg-libxrandr = "*"
xorg-libxinerama = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxfixes = "*"

[feature.sim.pypi-dependencies]
boost = { path = ".", editable = true, extras = ["sim"] }
televuer = { git = "https://github.com/unitreerobotics/televuer.git", rev = "766de45e74373ae0ea66321d942ce538385655a5" }
# Keep the Vuer server extra explicit so Televuer's WebSocket server runtime is
# installed in the desktop environment.
vuer = { version = "==0.0.60", extras = ["all"] }
# vuer 0.0.60 uses the params-proto v2 Flag API; v3 removed it while still
# satisfying vuer's open-ended >=2.13.0 requirement.
params-proto = "==2.13.2"
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git", rev = "814556d15970dd2ecf1c9984e845ca02ab07e206", editable = true }
dreamwaq-g1-29dof-deploy = { path = "external/dreamwaq_g1_29dof", editable = true }

[feature.sim.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/services/pose_service"
CYCLONEDDS_HOME = "$CONDA_PREFIX"

[feature.sim.tasks]
setup-sim = { cmd = "bash scripts/setup_mujoco_desktop.sh", description = "Prepare and inspect the Pixi desktop MuJoCo runtime" }
mujoco = { cmd = "bash scripts/run_galaxy_dreamwaq_mujoco.sh", description = "Run MuJoCo with DreamWaQ, PATH, and Galaxy XR" }
mujoco-hand-test = { cmd = "bash scripts/run_mujoco_hand_test.sh", description = "Run the backpack-trained DreamWaQ policy and Revo2 MPPI in local MuJoCo with an editable JSON hand pose; no XR/PATH" }
mujoco-hand-motion-test = { cmd = "bash scripts/run_mujoco_hand_test.sh --motion", description = "Run a synthetic repeated fist/open Revo2 MPPI test with DreamWaQ in local MuJoCo; no XR/PATH" }
mujoco-hand-xr = { cmd = "bash scripts/run_galaxy_dreamwaq_mujoco.sh --hand-mppi-xr", description = "Run live Galaxy XR to Televuer/PATH to Revo2 MPPI in DreamWaQ MuJoCo" }
mujoco-no-xr = { cmd = "bash scripts/run_galaxy_dreamwaq_mujoco.sh --no-xr", description = "Run DreamWaQ MuJoCo and PATH without Galaxy XR" }
mujoco-headless = { cmd = "bash scripts/run_galaxy_dreamwaq_mujoco.sh --no-xr --headless", description = "Run the DreamWaQ/PATH MuJoCo stack without XR or a viewer" }

[environments.sim]
features = ["sim"]
no-default-feature = true

# mimic_retargeter_lab uses Python 3.12 and a newer MuJoCo/MJX stack than PATH.
# Keep it isolated; the upstream repository's optional GPU extra selects its
# JAX CUDA 12 build for the local RTX desktop.
[feature.hand.dependencies]
python = "==3.12.3"
cyclonedds = "==0.10.5"

[feature.hand.pypi-dependencies]
boost = { path = ".", editable = true }
numpy = "==1.26.4"
mimic_retargeter_lab = { path = "boost/control/hand_mppi/upstream", editable = true, extras = ["gpu", "desktop"] }
geort = { path = "boost/control/hand_mppi/upstream/third_party/geort", editable = true }
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git", rev = "814556d15970dd2ecf1c9984e845ca02ab07e206", editable = true }

[feature.hand]
platforms = ["desktop-hand"]

[feature.hand.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/services/pose_service"
CYCLONEDDS_HOME = "$CONDA_PREFIX"

[feature.hand.tasks]
hand-mppi = { cmd = "python -m boost.control.hand_mppi.runner", description = "Inspect Televuer-to-Revo2 targets without publishing DDS commands" }

[environments.hand]
features = ["hand"]
no-default-feature = true

# Jetson Thor ARM64 hand runtime. JAX/CUDA 13 and NumPy 2 are isolated from
# Televuer/PATH's NumPy 1 environment and the x86 desktop's CUDA 12 stack.
# PyTorch is not installed: live retargeting uses JAX/MJX, not GeoRT inference.
[feature.thor.dependencies]
python = "==3.12.3"
cyclonedds = "==0.10.5"

[feature.thor.pypi-dependencies]
boost = { path = ".", editable = true }
numpy = ">=2.0,<3"
mimic_retargeter_lab = { path = "boost/control/hand_mppi/upstream", editable = true, extras = ["thor"] }
geort = { path = "boost/control/hand_mppi/upstream/third_party/geort", editable = true }
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git", rev = "814556d15970dd2ecf1c9984e845ca02ab07e206", editable = true }

[feature.thor]
platforms = ["thor"]

[feature.thor.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/services/pose_service"
CYCLONEDDS_HOME = "$CONDA_PREFIX"

[feature.thor.tasks]
hand-mppi-publish = { cmd = "bash scripts/run_hand_mppi_thor.sh", description = "Publish fresh Revo2 MPPI targets over DDS to the G1 BrainCo hand service" }
verify-thor = { cmd = "python scripts/verify_thor_environment.py", description = "Check Thor's ARM64, JAX CUDA, MuJoCo MJX, and Unitree SDK imports" }

[environments.thor]
features = ["thor"]
no-default-feature = true

# Televuer and PATH's current dependency stack remains NumPy 1.x. Keep the
# webcam/XR and IK processes separate from the NumPy 2 / CUDA 13 JAX runtime;
# they exchange fresh poses using the existing local ZMQ port 5566.
[feature.thor_teleop.dependencies]
python = "==3.12.3"
cyclonedds = "==0.10.5"

[feature.thor_teleop.pypi-dependencies]
boost = { path = ".", editable = true, extras = ["teleop"] }
numpy = "==1.26.4"
televuer = { git = "https://github.com/unitreerobotics/televuer.git", rev = "766de45e74373ae0ea66321d942ce538385655a5" }
vuer = { version = "==0.0.60", extras = ["all"] }
params-proto = "==2.13.2"
unitree_sdk2py = { git = "https://github.com/unitreerobotics/unitree_sdk2_python.git", rev = "814556d15970dd2ecf1c9984e845ca02ab07e206", editable = true }

[feature.thor_teleop]
platforms = ["thor-teleop"]

[feature.thor_teleop.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/services/pose_service"
CYCLONEDDS_HOME = "$CONDA_PREFIX"

[feature.thor_teleop.tasks]
path-state = { cmd = "bash scripts/run_state_machine_bridge.sh", description = "Run PATH arm IK and Televuer pose bridge on Thor" }
galaxy-xr = { cmd = "bash scripts/run_galaxy_xr_manager.sh", description = "Run the Galaxy XR/Televuer service on Thor" }
g1-arm-teleop = { cmd = "bash scripts/run_g1_xr_arm_teleop.sh", description = "Run verified arm-only Galaxy XR teleop on the XR host; DreamWaQ runs on G1" }
verify-thor-teleop = { cmd = "python scripts/verify_thor_teleop_environment.py", description = "Check Thor PATH, Televuer, LCM and Unitree SDK imports" }

[environments.thor-teleop]
features = ["thor_teleop"]
no-default-feature = true
